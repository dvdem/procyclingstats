<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volta a Portugal 2026 - Visor de Rutas</title>
    <meta name="description" content="Mapa interactivo etapa por etapa de la Volta a Portugal 2026 con perfiles de elevación">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-content">
                <div class="logo-area">
                    <div class="logo-icon">🚴</div>
                    <div>
                        <h1 class="title">Volta a Portugal 2026</h1>
                        <p class="subtitle">Visor de Rutas</p>
                    </div>
                </div>
            </div>
        </header>

        <div class="main-layout">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>Etapas</h2>
                    <span class="stage-count" id="stage-count">0</span>
                </div>
                <div class="stage-list" id="stage-list"></div>
            </aside>

            <main class="content">
                <div class="stage-info-bar" id="stage-info-bar">
                    <div class="stage-title-area">
                        <div class="title-row">
                            <div>
                                <h2 class="stage-title" id="stage-title">Resumen de Etapas</h2>
                                <p class="stage-subtitle" id="stage-subtitle">Haz clic en una etapa para ver el detalle</p>
                            </div>
                            <button id="back-button" class="back-button hidden">← Volver al resumen</button>
                        </div>
                    </div>
                    <div class="stage-stats" id="stage-stats"></div>
                </div>

                <div class="visualization-area">
                    <div class="map-container">
                        <div id="map"></div>
                        <div class="map-mode-toggle" id="map-mode-toggle">
                            <button class="map-mode-btn" id="btn-fullscreen" title="Ampliar mapa">⛶ Ampliar mapa</button>
                        </div>
                        <div class="wind-widget" id="wind-widget">
                            <div class="wind-badge">
                                <span class="wind-icon">💨</span>
                                <div class="wind-info-text">
                                    <span class="wind-title" id="wind-title">Viento: --</span>
                                    <span class="wind-details" id="wind-details">Buscando datos...</span>
                                </div>
                                <div class="wind-compass-box" title="Dirección del viento">
                                    <div class="wind-compass-arrow" id="wind-compass-arrow">↑</div>
                                </div>
                            </div>
                        </div>
                        <div class="map-legend" id="map-legend">
                            <span class="legend-title">Pendiente:</span>
                            <span class="legend-item"><span class="legend-color" style="background:#ffffff; border: 1px solid #666;"></span> &le;2% Llano/Bajada</span>
                            <span class="legend-item"><span class="legend-color" style="background:#eab308;"></span> 2-5%</span>
                            <span class="legend-item"><span class="legend-color" style="background:#f97316;"></span> 5-8%</span>
                            <span class="legend-item"><span class="legend-color" style="background:#ef4444;"></span> 8-11%</span>
                            <span class="legend-item"><span class="legend-color" style="background:#881337;"></span> &gt;11%</span>
                        </div>
                        <div class="map-overlay" id="map-overlay">
                            <div class="loading-spinner"></div>
                            <p>Cargando ruta...</p>
                        </div>
                    </div>
                    <div class="elevation-container">
                        <div class="elevation-header">
                            <h3>Perfil de Elevación</h3>
                            <div class="elevation-stats" id="elevation-stats"></div>
                        </div>
                        <div class="chart-wrapper">
                            <canvas id="elevation-chart"></canvas>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
