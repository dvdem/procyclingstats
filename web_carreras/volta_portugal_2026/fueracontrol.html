<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Calculadora Fuera de Control — La Vuelta</title>
  <meta name="theme-color" content="#b71c1c">
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: #f6f7fb;
      color: #222;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 980px;
      background: #fff;
      padding: 18px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(17, 24, 39, 0.06);
    }

    h1 {
      color: #b71c1c;
      margin: 0 0 12px;
    }

    label {
      font-weight: 600;
      display: block;
      margin: 8px 0 6px;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    input[type="number"],
    input[type="text"],
    select,
    textarea {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #d2d6dc;
      width: 100%;
    }

    input[type="number"] {
      max-width: 140px;
    }

    button {
      background: #b71c1c;
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    th,
    td {
      padding: 8px;
      border-bottom: 1px solid #eef0f6;
      text-align: left;
    }

    .good {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 8px;
      border-radius: 6px;
      display: inline-block;
    }

    .bad {
      background: #ffebee;
      color: #c62828;
      padding: 8px;
      border-radius: 6px;
      display: inline-block;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .small {
      font-size: 0.9rem;
      color: #555;
    }

    textarea {
      min-height: 100px;
      font-family: monospace;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .note {
      font-size: 0.9rem;
      color: #444;
      margin-top: 10px;
    }

    @media (max-width:800px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .row {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Calculadora Fuera de Control — La Vuelta </h1>
    <div class="small">Selecciona la etapa y el tiempo del ganador</div>

    <div class="grid" style="grid-template-columns:1fr; margin-top:12px;">
      <div>
        <label>Selecciona etapa</label>
        <div class="row">
          <select id="stageSelect" style="width:100%"></select>
        </div>

        <label style="margin-top:10px;">Tiempo del ganador (HH:MM:SS)</label>
        <div class="row">
          <input type="number" id="winH" min="0" placeholder="HH" value="4">
          <input type="number" id="winM" min="0" max="59" placeholder="MM" value="0">
          <input type="number" id="winS" min="0" max="59" placeholder="SS" value="0">
          <!--input type="number" id="distance" step="0.1" placeholder="Distancia (km)" title="Se autocompleta al elegir etapa"-->
        </div>
        <div id="stageSpeed" class="small" style="margin-top:8px;"></div>
        <div id="stageRates" class="small" style="margin-top:8px;"></div>

        <div class="row">
          <button type="button" id="loadWinnerBtn" onclick="loadWinnerTime()"
            title="Cargar el tiempo del ganador para la etapa seleccionada">Tiempo ganador</button>
          <button type="button" onclick="computeLimit()">Calcular límite</button>
        </div>
        <div id="resultado" class="small" style="margin-top:8px;"></div>
        <div id="winnerStatus" class="small" style="margin-top:8px;"></div>

        <div id="summary" style="margin-top:12px;"></div>
      </div>

    </div>

    <div id="resultsArea" style="margin-top:12px"></div>

    <hr style="margin:12px 0">
    <div class="small">
      Nota: baremos oficiales extraídos de Art.11. En casos excepcionales el colegio de comisarios puede ajustar los
      baremos;
    </div>
  </div>

  <script>
    /* Etapas (extraído de tu imagen) */
    const STAGES = [
      { n: 1, from: 'Monaco', to: 'Monaco', km: 9.4, type: 'CRI', group: '6' },
      { n: 2, from: 'Monaco', to: 'Manosque', km: 204, type: 'Ondulada', group: '3' },
      { n: 3, from: 'Gruissan - Aude', to: 'Font Romeu', km: 174, type: 'Media Montaña', group: '3' },
      { n: 4, from: 'Andorra la Vella', to: 'Andorra la Vella', km: 104.8, type: 'Montaña', group: '5' },
      { n: 5, from: 'Falset. Costa Daurada', to: 'Roquetes. Terres de l\'Ebre', km: 173.3, type: 'Ondulada', group: '2' },
      { n: 6, from: 'Alcossebre', to: 'Castelló', km: 177.4, type: 'Media Montaña', group: '4' },
      { n: 7, from: "Vall d'Alba", to: 'Aramón Valdelinares', km: 149.8, type: 'Montaña', group: '5' },
      { n: 8, from: 'Puçol', to: 'Xeraco', km: 171, type: 'Llana', group: '2' },
      { n: 9, from: 'La Vila Joiosa/Villajoyosa', to: 'Alto de Aitana. Costa Blanca', km: 187.4, type: 'Montaña', group: '5' },
      { n: 10, from: 'Alcaraz', to: 'Elche de la Sierra', km: 184.7, type: 'Ondulada', group: '3' },
      { n: 11, from: 'Cartagena', to: 'Lorca', km: 151.3, type: 'Llana', group: '1' },
      { n: 12, from: 'Vera', to: 'Calar Alto', km: 166.6, type: 'Montaña', group: '5' },
      { n: 13, from: 'Almuñécar', to: 'Loja', km: 192.8, type: 'Media Montaña', group: '3' },
      { n: 14, from: 'Jaén', to: 'Sierra de la Pandera', km: 154.5, type: 'Montaña', group: '5' },
      { n: 15, from: 'Palma del Río', to: 'Córdoba', km: 189.7, type: 'Media Montaña', group: '5' },
      { n: 16, from: 'Cortegana', to: 'La Rábida. Palos de la Frontera', km: 181.1, type: 'Ondulada', group: '3' },
      { n: 17, from: 'Dos Hermanas', to: 'Sevilla', km: 185, type: 'Llana', group: '1' },
      { n: 18, from: 'El Puerto de Santa María', to: 'Jerez de la Frontera', km: 32.1, type: 'CRI', group: '6' },
      { n: 19, from: 'Vélez-Málaga', to: 'Peñas Blancas. Estepona', km: 210.8, type: 'Ondulada con final en Alto', group: '4' },
      { n: 20, from: 'La Calahorra', to: 'Collado del Alguacil', km: 186.8, type: 'Montaña', group: '5' },
      { n: 21, from: 'Carrefour Granada', to: 'Granada', km: 112, type: 'Llana', group: '2' },
    ];

    /* Baremos oficiales (función) */
    function getPercentFromTable(group, speed) {
      const sp = (typeof speed === 'number' && !isNaN(speed)) ? speed : null;
      switch (String(group)) {
        case '1':
          if (sp === null) return 10;
          if (sp <= 34) return 7;
          if (sp <= 36) return 8;
          if (sp <= 38) return 9;
          if (sp <= 40) return 10;
          if (sp <= 42) return 11;
          if (sp <= 44) return 12;
          if (sp <= 46) return 13;
          if (sp <= 48) return 14;
          return 15;
        case '2':
          if (sp === null) return 11;
          if (sp <= 34) return 6;
          if (sp <= 36) return 7;
          if (sp <= 38) return 9;
          if (sp <= 40) return 11;
          if (sp <= 42) return 13;
          if (sp <= 44) return 15;
          if (sp <= 46) return 17;
          return 19;
        case '3':
          if (sp === null) return 12;
          if (sp <= 32) return 6;
          if (sp <= 34) return 8;
          if (sp <= 36) return 10;
          if (sp <= 38) return 12;
          if (sp <= 40) return 14;
          if (sp <= 42) return 16;
          return 18;
        case '4':
          if (sp === null) return 12;
          if (sp <= 30) return 6;
          if (sp <= 32) return 8;
          if (sp <= 34) return 10;
          if (sp <= 36) return 12;
          if (sp <= 38) return 14;
          if (sp <= 40) return 16;
          return 18;
        case '5':
          if (sp === null) return 16;
          if (sp <= 30) return 10;
          if (sp <= 32) return 12;
          if (sp <= 34) return 14;
          if (sp <= 36) return 16;
          if (sp <= 38) return 18;
          if (sp <= 40) return 20;
          return 22;
        case '6':
          return 35;
        default:
          return 0;
      }
    }

    /* Utilidades de tiempo */
    function hhmmssToSec(h, m, s) { const H = parseInt(h) || 0, M = parseInt(m) || 0, S = parseInt(s) || 0; return H * 3600 + M * 60 + S; }
    function secToHHMMSS(sec) { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60; return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'); }
    function secToMMSS(sec) { sec = Math.max(0, Math.round(sec)); return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0'); }

    let lastResult = null;

    /* Poblado del select de etapas */
    function populateStages() {
      const sel = document.getElementById('stageSelect');
      sel.innerHTML = '';
      STAGES.forEach(st => {
        const opt = document.createElement('option');
        opt.value = st.n;
        opt.text = `${st.n} — ${st.from} → ${st.to} (${st.km} km) [${st.type}] [Grupo ${st.group}]`;
        sel.appendChild(opt);
      });
      sel.addEventListener('change', onStageChange);
      // seleccionar 1 por defecto y disparar
      sel.value = '1';
      onStageChange();
    }

    /* Cuando cambia etapa: autocompletar distancia y grupo y mostrar info */
    function onStageChange() {
      const s = document.getElementById('stageSelect').value;
      const stage = STAGES.find(x => String(x.n) === String(s));
      if (!stage) return;
      lastResult = null;
      document.getElementById('resultsArea').innerHTML = '';
      document.getElementById('summary').innerHTML = '';
      document.getElementById('winnerStatus').textContent = '';
      document.getElementById('resultado').textContent = '';
      updateAverageSpeed();
      loadWinnerTime();
    }

    function getSpeedRanges(group) {
      const ranges = {
        '1': [[34, 7], [36, 8], [38, 9], [40, 10], [42, 11], [44, 12], [46, 13], [48, 14], [Infinity, 15]],
        '2': [[34, 6], [36, 7], [38, 9], [40, 11], [42, 13], [44, 15], [46, 17], [Infinity, 19]],
        '3': [[32, 6], [34, 8], [36, 10], [38, 12], [40, 14], [42, 16], [Infinity, 18]],
        '4': [[30, 6], [32, 8], [34, 10], [36, 12], [38, 14], [40, 16], [Infinity, 18]],
        '5': [[30, 10], [32, 12], [34, 14], [36, 16], [38, 18], [40, 20], [Infinity, 22]],
        '6': [[Infinity, 35]]
      };
      return ranges[String(group)] || [];
    }

    function renderStageRates(group, speed) {
      const ratesElement = document.getElementById('stageRates');
      const ranges = getSpeedRanges(group);
      let lowerLimit = null;
      let rows = '';

      ranges.forEach(([upperLimit, percent]) => {
        const label = upperLimit === Infinity
          ? (lowerLimit === null ? 'Cualquier velocidad' : `Más de ${lowerLimit} km/h`)
          : (lowerLimit === null ? `Hasta ${upperLimit} km/h` : `Más de ${lowerLimit} hasta ${upperLimit} km/h`);
        const selected = typeof speed === 'number' && getPercentFromTable(group, speed) === percent &&
          (lowerLimit === null ? speed <= upperLimit : speed > lowerLimit && speed <= upperLimit);
        rows += `<tr${selected ? ' style="font-weight:700;background:#e8f5e9;"' : ''}><td>${label}</td><td>${percent}%</td></tr>`;
        if (upperLimit !== Infinity) lowerLimit = upperLimit;
      });

      ratesElement.innerHTML = ranges.length
        ? `<strong>Grupo ${group}: baremo por velocidad media</strong><table style="margin-top:4px;"><thead><tr><th>Velocidad media</th><th>Porcentaje</th></tr></thead><tbody>${rows}</tbody></table>`
        : '';
    }

    function updateAverageSpeed() {
      const selectedStage = document.getElementById('stageSelect').value;
      const stage = STAGES.find(x => String(x.n) === String(selectedStage));
      const winnerSec = hhmmssToSec(
        document.getElementById('winH').value,
        document.getElementById('winM').value,
        document.getElementById('winS').value
      );
      const distance = stage ? stage.km : null;
      const speedElement = document.getElementById('stageSpeed');

      if (winnerSec <= 0 || isNaN(distance) || distance <= 0) {
        speedElement.textContent = '';
        renderStageRates(stage ? stage.group : null, null);
        return;
      }

      const speed = Math.round((distance / (winnerSec / 3600)) * 100) / 100;
      speedElement.innerHTML = `<strong>Velocidad media de la etapa:</strong> ${speed} km/h`;
      renderStageRates(stage.group, speed);
    }

    ['winH', 'winM', 'winS'].forEach(id => {
      document.getElementById(id).addEventListener('input', updateAverageSpeed);
    });

    function parseRaceCenterTime(value) {
      if (value === null || value === undefined || value === '') return null;
      if (typeof value === 'number') return Math.round(value);
      if (typeof value === 'string') {
        const trimmed = value.trim();
        if (!trimmed) return null;
        const parts = trimmed.split(':').map(p => Number(p));
        if (parts.length === 3 && parts.every(n => !Number.isNaN(n))) {
          return parts[0] * 3600 + parts[1] * 60 + parts[2];
        }
        if (parts.length === 2 && parts.every(n => !Number.isNaN(n))) {
          return parts[0] * 60 + parts[1];
        }
        const numeric = Number(trimmed);
        if (!Number.isNaN(numeric)) return Math.round(numeric);
      }
      return null;
    }

    async function loadWinnerTime() {
      const stageNumber = document.getElementById('stageSelect').value;
      const statusElement = document.getElementById('winnerStatus');
      const resultElement = document.getElementById('resultado');
      const loadButton = document.getElementById('loadWinnerBtn');
      statusElement.textContent = 'Consultando Race Center...';
      resultElement.textContent = '';
      if (loadButton) loadButton.disabled = true;

      try {
        const candidates = [];
        const currentOrigin = window.location.origin && window.location.origin !== 'null' ? window.location.origin : '';
        if (currentOrigin) {
          candidates.push(`${currentOrigin}/api/ganador/${stageNumber}?at=${Date.now()}`);
        }
        candidates.push(`/api/ganador/${stageNumber}?at=${Date.now()}`);
        // Backend dedicado en Cloud Run (necesario cuando esta página se sirve desde un origen estático, p.ej. GCS)
        candidates.push(`https://fueracontrolvuelta26-718519265954.europe-west1.run.app/api/ganador/${stageNumber}?at=${Date.now()}`);
        candidates.push(`http://127.0.0.1:8080/api/ganador/${stageNumber}?at=${Date.now()}`);
        candidates.push(`http://localhost:8080/api/ganador/${stageNumber}?at=${Date.now()}`);

        let totalSeconds = null;
        let lastError = null;

        for (const url of candidates) {
          try {
            const response = await fetch(url, { cache: 'no-store' });
            const result = await response.json().catch(() => ({}));
            if (response.ok && result.ok && Number.isFinite(result.winnerTimeSeconds)) {
              totalSeconds = Math.round(result.winnerTimeSeconds);
              break;
            }
            lastError = new Error(result.error || `Error ${response.status}`);
          } catch (error) {
            lastError = error;
          }
        }

        if (totalSeconds === null) {
          const isFileOrigin = window.location.protocol === 'file:';
          const message = isFileOrigin
            ? 'Abre esta página desde http://127.0.0.1:8080 para que la API local funcione.'
            : (lastError && lastError.message) || 'No hay tiempo disponible para esta etapa.';
          throw new Error(message);
        }

        document.getElementById('winH').value = Math.floor(totalSeconds / 3600);
        document.getElementById('winM').value = Math.floor((totalSeconds % 3600) / 60);
        document.getElementById('winS').value = totalSeconds % 60;
        resultElement.textContent = `Ganador etapa ${stageNumber}: ${secToHHMMSS(totalSeconds)}`;
        updateAverageSpeed();
        computeLimit();
        statusElement.textContent = 'Tiempo del ganador cargado desde Race Center';
      } catch (error) {
        statusElement.textContent = error.message;
        resultElement.textContent = 'No se pudo obtener el tiempo del ganador.';
      } finally {
        if (loadButton) loadButton.disabled = false;
      }
    }

    /* Cálculo del límite */
    function computeLimit() {
      const h = document.getElementById('winH').value;
      const m = document.getElementById('winM').value;
      const s = document.getElementById('winS').value;
      const selectedStage = document.getElementById('stageSelect').value;
      const stage = STAGES.find(x => String(x.n) === String(selectedStage));
      if (!stage) { alert('Selecciona una etapa válida.'); return; }
      const dist = stage.km;
      const group = stage.group;
      const winnerSec = hhmmssToSec(h, m, s);
      if (winnerSec <= 0) { alert('Introduce un tiempo válido del ganador.'); return; }

      let speed = null;
      if (!isNaN(dist) && dist > 0) {
        speed = Math.round((dist / (winnerSec / 3600.0)) * 100) / 100;
      }

      const percent = getPercentFromTable(group, speed);
      const limitSec = Math.round(winnerSec * (1 + (percent / 100)));
      const controlMarginSec = limitSec - winnerSec;
      lastResult = { winnerSec, limitSec, percent, speed, group };

      const summaryDiv = document.getElementById('summary');
      summaryDiv.innerHTML = `<div class="good"><strong>Fuera de control respecto al primero:</strong> +${secToMMSS(controlMarginSec)} &nbsp; | &nbsp; <strong>Tiempo límite:</strong> ${secToHHMMSS(limitSec)} &nbsp; | &nbsp; Porcentaje aplicado: ${percent}%` +
        (speed !== null ? ` &nbsp; | &nbsp; Velocidad vencedor: ${speed} km/h` : '') +
        ` &nbsp;</div>`;
      document.getElementById('resultsArea').innerHTML = '';
    }

    /* Procesar lista de corredores */
    function parseLine(line) {
      const trimmed = line.trim();
      if (!trimmed) return null;
      if (trimmed.indexOf(',') >= 0) {
        const parts = trimmed.split(',').map(s => s.trim());
        let timePart = null, namePart = null;
        for (const p of parts) if (/^\d{1,2}:\d{2}:\d{2}$/.test(p)) timePart = p;
        if (timePart) {
          const idx = parts.indexOf(timePart);
          namePart = parts.slice(0, idx).concat(parts.slice(idx + 1)).join(', ') || 'Corredor';
          return { name: namePart, time: timePart };
        } else {
          return { name: parts[0], time: parts[1] || null };
        }
      }
      const tokens = trimmed.split(/\s+/);
      const last = tokens[tokens.length - 1];
      if (/^\d{1,2}:\d{2}:\d{2}$/.test(last)) return { name: tokens.slice(0, tokens.length - 1).join(' '), time: last };
      if (/^\d{1,2}:\d{2}$/.test(last)) return { name: tokens.slice(0, tokens.length - 1).join(' '), time: last };
      return { name: trimmed, time: null };
    }
    function timeStringToSec(ts) {
      if (!ts) return null;
      const parts = ts.split(':').map(p => parseInt(p, 10));
      if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
      if (parts.length === 2) return parts[0] * 60 + parts[1];
      return null;
    }

    function processRiders() {
      if (!lastResult) { alert('Primero calcula el tiempo límite.'); return; }
      const txt = document.getElementById('ridersList').value;
      const lines = txt.split(/\r?\n/);
      const rows = [];
      for (const ln of lines) {
        if (!ln.trim()) continue;
        const p = parseLine(ln);
        if (!p) continue;
        const sec = timeStringToSec(p.time);
        rows.push({ name: p.name || 'Corredor', timeStr: p.time || '-', sec });
      }
      if (rows.length === 0) { document.getElementById('resultsArea').innerHTML = '<div class="small">Lista vacía.</div>'; return; }

      const winnerSec = lastResult.winnerSec, limit = lastResult.limitSec;
      let html = '<table><thead><tr><th>Corredor</th><th>Tiempo</th><th>Estado</th><th>Difer vs ganador</th></tr></thead><tbody>';
      for (const r of rows) {
        let state = 'SIN TIEMPO', diff = '-';
        if (r.sec !== null) {
          const diffSec = r.sec - winnerSec;
          diff = (diffSec >= 0 ? '+' : '-') + secToHHMMSS(Math.abs(diffSec));
          state = (r.sec <= limit) ? `<span class="good">DENTRO</span>` : `<span class="bad">FUERA</span>`;
        }
        html += `<tr><td>${escapeHtml(r.name)}</td><td>${r.timeStr}</td><td>${state}</td><td>${diff}</td></tr>`;
      }
      html += '</tbody></table>';
      document.getElementById('resultsArea').innerHTML = html;
      lastResult.rows = rows;
    }

    function downloadCSV() {
      if (!lastResult || !lastResult.rows) { alert('Procesa la lista antes de exportar.'); return; }
      const rows = lastResult.rows;
      const winnerSec = lastResult.winnerSec;
      const limit = lastResult.limitSec;
      const percent = lastResult.percent;
      let csv = 'Nombre,Tiempo,Estado,Diff_vs_ganador_segundos,PorcentajeAplicado,TiempoLimite\n';
      for (const r of rows) {
        let state = 'SIN TIEMPO', diff = '';
        if (r.sec !== null) {
          state = (r.sec <= limit) ? 'DENTRO' : 'FUERA';
          diff = r.sec - winnerSec;
        }
        csv += `"${r.name.replace(/"/g, '""')}","${r.timeStr}","${state}","${diff}","${percent}","${secToHHMMSS(limit)}"\n`;
      }
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'fuera_de_control_resultados.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    /* Simple HTML escape */
    function escapeHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    /* Inicializar */
    window.addEventListener('load', function () {
      populateStages();
    });
  </script>
</body>

</html>
