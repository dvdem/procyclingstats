server {
    listen 8080;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Habilitar compresión gzip para JSON y GPX
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/gpx+xml;
}
